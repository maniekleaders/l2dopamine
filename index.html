<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #c9a96e; font-family: Georgia, serif; overflow-x: hidden; }
  .video-container { width: 100%; height: 220px; }
  .video-container iframe { width: 100%; height: 100%; border: none; }
  .news { padding: 10px 14px; }
  .news h2 { font-size: 13px; color: #c9a96e; border-bottom: 1px solid #3a2a1a; padding-bottom: 5px; margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase; }
  .post { margin-bottom: 10px; border-left: 2px solid #6b3a1f; padding-left: 8px; }
  .post .date { font-size: 10px; color: #7a6a4a; }
  .post .title { font-size: 12px; color: #e0c080; margin: 2px 0; }
  .post .desc { font-size: 11px; color: #a09070; line-height: 1.4; }
</style>
</head>
<body>
  <div class="video-container">
    <iframe src="https://www.youtube.com/embed/qlrpeYdm9Ec?autoplay=1&mute=1"
      allow="autoplay; encrypted-media" allowfullscreen>
    </iframe>
  </div>
  <div class="news">
    <h2>Aktualności</h2>
    <div class="post">
      <div class="date">07.06.2026</div>
      <div class="title">Serwer uruchomiony!</div>
      <div class="desc">Witamy na L2 Dopamine. Serwer działa na wersji Gracia Final.</div>
    </div>
    <div class="post">
      <div class="date">07.06.2026</div>
      <div class="title">Jak dołączyć?</div>
      <div class="desc">Pobierz klienta, uruchom updater i kliknij START. Miłej gry!</div>
    </div>
  </div>
</body>
</html>
